<h1>Contact</h1>
<p class="lead">Tell me a little about your project and your timeline. I reply within two working days.</p>
<form class="form" action="/_form/contact" method="post">
  <label>Your name <input name="name" required maxlength="100" autocomplete="name"></label>
  <label>Email <input name="email" type="email" required maxlength="200" autocomplete="email"></label>
  <label>About the project <textarea name="message" rows="6" required maxlength="5000"></textarea></label>

  <input type="hidden" name="_subject" value="New project enquiry">
  <label class="trap" aria-hidden="true">Leave this empty <input name="_gotcha" tabindex="-1" autocomplete="off"></label>
  <button class="button">Send enquiry</button>
</form>
